<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090a16" />
    </radialGradient>
    <linearGradient id="glassRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glass Orb -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#glassRing)" stroke-width="12" opacity="0.85" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />

  <!-- Inner Liquid Glow -->
  <circle cx="210" cy="180" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="310" cy="310" r="120" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Sound Waves (Liquid Ripple) -->
  <path d="M120 256 A 136 136 0 0 1 150 170" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <path d="M392 256 A 136 136 0 0 0 362 170" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round" opacity="0.6" />

  <!-- Musical Note Icon -->
  <g filter="url(#glow)">
    <path d="M336 128 L236 156 V292 C226 284 212 280 196 280 C162.8 280 136 299.7 136 324 C136 348.3 162.8 368 196 368 C229.2 368 256 348.3 256 324 V200 L336 178 V268 C326 260 312 256 296 256 C262.8 256 236 275.7 236 300 C236 324.3 262.8 344 296 344 C329.2 344 356 324.3 356 300 V144 C356 134 346 126 336 128 Z" fill="url(#noteGrad)" />
  </g>
</svg>

